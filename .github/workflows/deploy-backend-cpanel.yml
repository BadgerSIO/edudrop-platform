name: Build & Publish Backend Bundle for cPanel

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-cpanel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-backend-cpanel
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build TypeScript & Push deploy-backend Branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate seed snapshots and assets
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const seedDir = "backend/seed";
          for (const file of fs.readdirSync(seedDir).filter(f => f.endsWith(".json"))) {
            const raw = fs.readFileSync(path.join(seedDir, file), "utf8");
            const docs = JSON.parse(raw);
            const matches = [...raw.matchAll(/"(\/(?:uploads|home|images)\/[^"]+)"/g)].map(m => m[1]);
            for (const url of new Set(matches)) {
              const clean = url.replace(/^\//, "");
              const target = clean.startsWith("uploads/") ? path.join("backend", clean) : path.join("frontend/public", clean);
              if (!fs.existsSync(target)) throw new Error(`Missing seed asset ${target} referenced in ${file}`);
            }
            console.log(`OK ${file}: ${docs.length} docs, ${new Set(matches).size} unique assets`);
          }
          '

      - name: Typecheck & build backend
        working-directory: backend
        run: |
          npx tsc --noEmit
          npm run build

      - name: Stage clean production bundle and push deploy-backend branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE_DIR="$(mktemp -d)"
          cp -r backend/dist backend/seed backend/uploads backend/package.json backend/package-lock.json backend/app.js "$BUNDLE_DIR/"

          cd "$BUNDLE_DIR"
          git init -b deploy-backend
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy(backend): build ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin deploy-backend
          rm -rf "$BUNDLE_DIR"
